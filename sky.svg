<text class="star" x="1114" y="786">,</text><text class="name" x="1123" y="784" text-anchor="start">Caron</text>
<text class="star" x="203" y="579">,</text><text class="name" x="212" y="577" text-anchor="start">Ampersand</text>
<text class="star" x="1094" y="61">.</text><text class="name" x="1103" y="59" text-anchor="start">Bracket</text>
<text class="star" x="951" y="561">,</text><text class="name" x="960" y="559" text-anchor="start">Thorn</text>
</g>
<text class="star" x="68" y="962">.</text><text class="note" x="84" y="960">a full stop, faint</text>
<text class="star" x="268" y="966">'</text><text class="note" x="284" y="960">an apostrophe, upright</text>
<text class="star" x="508" y="966">`</text><text class="note" x="524" y="960">a grave, leaning</text>
<text class="star" x="708" y="960">,</text><text class="note" x="724" y="960">a comma, hung low</text>
<text class="star" x="928" y="965">+</text><text class="note" x="944" y="960">a plus, the brightest kind there is</text>
<text class="note" x="60" y="996">The chart is the shape of a wide page. On a tall one the sky is the same sky, stood on end, and the stars keep their places by proportion.</text>
<text class="note" x="60" y="1018">Ogonek is behind the world on most pages and is charted by dead reckoning. The joined-up figures are not official. Nothing is.</text>
</svg>
