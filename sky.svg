<text class="star" x="40" y="651">,</text><text class="name" x="40" y="624" text-anchor="middle">Descender</text>
<text class="star" x="1071" y="781">`</text><text class="name" x="1071" y="765" text-anchor="middle">Majuscule</text>
<text class="star" x="14" y="337">`</text><text class="name" x="23" y="335" text-anchor="start">Minuscule</text>
<text class="star" x="679" y="317">,</text><text class="name" x="688" y="315" text-anchor="start">Hedera</text>
<text class="star" x="138" y="626">+</text><text class="name" x="147" y="624" text-anchor="start">Coronis</text>
<text class="star" x="409" y="259">,</text><text class="name" x="418" y="257" text-anchor="start">Diple</text>
<text class="star" x="310" y="540">.</text><text class="name" x="319" y="538" text-anchor="start">Catchword</text>
<text class="star" x="880" y="725">.</text><text class="name" x="889" y="723" text-anchor="start">Flyleaf</text>
<text class="star" x="354" y="383">,</text><text class="name" x="363" y="381" text-anchor="start">Vellum</text>
<text class="star" x="430" y="730">'</text><text class="name" x="439" y="728" text-anchor="start">Palimpsest</text>
<text class="star" x="936" y="161">`</text><text class="name" x="945" y="159" text-anchor="start">Addendum</text>
<text class="star" x="361" y="590">'</text><text class="name" x="370" y="588" text-anchor="start">Corrigendum</text>
<text class="star" x="1028" y="560">'</text><text class="name" x="1037" y="558" text-anchor="start">Scholium</text>
<text class="star" x="450" y="202">'</text><text class="name" x="459" y="200" text-anchor="start">Siglum</text>
