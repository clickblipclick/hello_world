<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1040" role="img" aria-labelledby="t d">
<title id="t">The Apostrophes: a chart of the fixed stars</title>
<desc id="d">Seventy stars, each a punctuation mark with a printer's word for a name, plotted where they stand behind the page that says hello world. Four constellations are joined up. A dashed circle in the middle marks where the world gets in the way.</desc>
<!-- Drawn from the same deck the sky is dealt from. If a star here is not where the sky has it, the sky is right. -->
<style>
  .bg { fill: #0d1321; }
  .rule { fill: none; stroke: #263048; }
  .head { font: 22px Georgia, serif; letter-spacing: 0.3em; fill: #7fb7a4; }
  .note { font: italic 15px Georgia, serif; fill: #6b7388; }
  .star { font: 15px ui-monospace, Menlo, Consolas, monospace; fill: #e8e6df; text-anchor: middle; }
  .name { font: 9.5px Georgia, serif; letter-spacing: 0.04em; fill: #8d94a8; }
  .join { fill: none; stroke: #7fb7a4; stroke-width: 0.8; stroke-dasharray: 2 4; }
  .fig { font: italic 12px Georgia, serif; fill: #7fb7a4; }
  .world { fill: none; stroke: #d9cfa6; stroke-width: 0.8; stroke-dasharray: 1 6; }
  .here { font: italic 12px Georgia, serif; fill: #d9cfa6; text-anchor: middle; }
  .tick { font: 10px ui-monospace, Menlo, Consolas, monospace; fill: #6b7388; }
</style>
<rect class="bg" width="1320" height="1040"/>
<text class="head" x="60" y="58">THE APOSTROPHES</text>
<text class="note" x="60" y="84">A chart of the fixed stars, all seventy, surveyed from the front of the page by pointing.</text>
<g transform="translate(60 120)">
<rect class="rule" width="1200" height="800"/>
<path class="rule" d="M300 0v8M300 800v-8M0 200h8M1200 200h-8"/>
<path class="rule" d="M600 0v8M600 800v-8M0 400h8M1200 400h-8"/>
<path class="rule" d="M900 0v8M900 800v-8M0 600h8M1200 600h-8"/>
<text class="tick" x="6" y="-8">left margin</text>
<text class="tick" x="1194" y="-8" text-anchor="end">right margin</text>
<circle class="world" cx="600" cy="400" r="118"/>
<text class="here" x="600" y="372">the world stands here,</text>
<text class="here" x="600" y="388">and is in the way</text>
<path class="join" d="M40 646L71 655L97 645"/>
<text class="fig" x="70" y="690">The Ellipsis</text>
<path class="join" d="M532 561L602 553L674 509"/>
<text class="fig" x="640" y="580">The Em Dash, bent</text>
<path class="join" d="M354 378L409 254L452 333"/>
<text class="fig" x="300" y="320">The Greater Caret</text>
<path class="join" d="M919 116L936 156L946 188L1026 184L993 132L919 116"/>
<text class="fig" x="1040" y="110">The Thumbprint</text>
