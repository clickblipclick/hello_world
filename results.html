(function () {

    ['#', 'The Hash', 'The bright uplands, wherever the light happens to fall. Not a place so much as a time of day.'],

    ['*', 'The Asterisk Caps', 'Ice at both poles, each flake a footnote to something nobody wrote down.'],
    ['+', 'The Asterisk Caps, dark side', 'The same ice with the light off it. The only arithmetic the planet does.'],
    ['@', 'The At', 'The moon. It has one side and shows it to everybody. It was not looking for post.'],
    ['!', 'The Exclamations', 'Flags, left by visitors. You have brought one with you; it has not been planted by being typed.'],
    ['\'', 'The Apostrophes', 'The stars. They are the same for everyone, having been dealt once from a fixed deck.'],
    ['`', 'The Apostrophes', 'The stars, leaning the other way. They do not turn with the world, or at all.'],
    ['^', 'The Caret', 'A ship, and the only one. Its present position is not held here. It is not held anywhere.'],
    ['?', 'Elsewhere', 'Everything that is not the world. There is a great deal of it and none of it is listed, including, most likely, what you were after.'],
    ['%', 'The Percent', 'A bottle, when there is one. It goes where the water goes.'],
    ['"', 'The Dittos', 'Weather. Each mark means the same as the one above it, which is what the mark is for.'],
    [',', 'The Commas', 'Small, curled, and fastened to the bottom, where they wait for the sentence to go on.'],
    [';', 'The Commas', 'One of the larger ones. The only life so far reported. They have not confirmed it.']

    var li = document.createElement('li'), c = document.createElement('cite'), a = document.createElement('a');

    if (mark) { var b = document.createElement('b'); b.textContent = mark; a.appendChild(b); }

    : hello ? '. The first half. The second is kept directly after it, a space along, and has been since the beginning.'
    : world ? '. The second half. It was greeted before you got here; the greeting is the half you left out.'
    : '. Neither word was asked for. It is shown because it is the nearest thing held, and also the furthest, being the only one.'));
  hit('hello world', '', 'helloworldandthen.com', './', first);
